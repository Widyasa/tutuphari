<!doctype html>
<html lang="id" style="color-scheme: light only">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F5F4" />
    <title>TutupHari</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        background: #f5f5f4;
        color: #0a0a0a;
        font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
        padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));

      h1 { font-size: 1.5rem; margin: 0 0 8px; }

        min-height: 48px;

        padding: 0 16px;

        border-radius: 10px;
        background: #14532d;
        color: #fff;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <p style="font-weight: 700; color: #14532d">TutupHari</p>
    <h1>Kamu sedang offline</h1>

      Halaman ini tersimpan di HP. AI tidak tersedia saat offline. Catatan yang sudah ada tetap di HP ini dan tidak ikut terhapus.
    </p>
    <button type="button" onclick="location.reload()">Muat ulang</button>

</html>
